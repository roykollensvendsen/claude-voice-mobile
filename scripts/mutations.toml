# Every rule this project enforces, and the one line that carries it.
#
# A rule nothing catches is a rule nothing protects. `scripts/mutate.py` turns
# each of these off in turn and runs the suite; a rule whose removal breaks no
# test has no test. Add a test of your own that counts the rules in the source
# against the rows here, so this list cannot fall behind.
#
# `find` is a regular expression matching the single line to replace; `replace`
# is what replaces it, keeping the file valid. The line's own indentation is
# kept, so do not write indentation here.
#
# [[rule]]
# name = "what the rule says, in words"
# file = "src/claude_voice_mobile/somewhere.py"
# find = 'if limit_exceeded:'
# replace = 'if False:'

# The repository's own scripts. The app's Kotlin code is guarded by Pitest instead.

[[rule]]
name = "a subject that opens a noun phrase is refused"
file = "scripts/imperative.py"
find = '\(word in NOT_A_VERB, "opens a phrase rather than an instruction"\),'
replace = '(False, "opens a phrase rather than an instruction"),'

[[rule]]
name = "a subject in the past tense is refused"
file = "scripts/imperative.py"
find = '\(word\.endswith\("ed"\), "is a past tense"\),'
replace = '(False, "is a past tense"),'

[[rule]]
name = "a commit message never links to a Claude session"
file = "scripts/no_session_links.py"
find = 'if SESSION\.search\(message\):'
replace = 'if False:'

[[rule]]
name = "a killed run's temporary files are swept at the next start"
file = "scripts/mutate.py"
find = 'for left in MUTATE_TMP\.iterdir\(\) if MUTATE_TMP\.is_dir\(\) else \[\]:'
replace = 'for left in []:'

[[rule]]
name = "a file changed during the run is never restored over"
file = "scripts/mutate.py"
find = 'if path\.read_text\(\) != mutated:'
replace = 'if False:'

[[rule]]
name = "two mutations never share a bytecode cache"
file = "scripts/mutate.py"
find = 'env = \{\*\*os\.environ, "PYTHONDONTWRITEBYTECODE": "1"\}'
replace = 'env = {**os.environ}'

[[rule]]
name = "a suite run leaves no temporary files behind"
file = "scripts/mutate.py"
find = '^\s*_remove\(temporary\)$'
replace = 'pass'

[[rule]]
name = "a coloured failure line is still attributed"
file = "scripts/mutate.py"
find = 'plain = ANSI\.sub\("", r\.stdout\)'
replace = 'plain = r.stdout'

[[rule]]
name = "an empty rule table is not a crash"
file = "scripts/mutate.py"
find = '^\s*if not rules:$'
replace = 'if False:'
