name: checks

# pull_request covers every pull request; push:main covers a direct push to main.
# A commit cannot be both, so the pair never runs the same commit twice.
on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a new push cancels the run it superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository, its issues or its packages.
permissions:
  contents: read

jobs:
  # Conventional Commits, over the commits this pull request adds.
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Dependabot writes a body line carrying two full commit hashes, which no
    # length rule survives, and its messages are not a person's to fix.
    # A direct push to main was linted by nothing: the range below only exists
    # on a pull request, so the job skipped itself and the local hook, which
    # --no-verify bypasses, was the only check. The range is now worked out for
    # both events. Dependabot writes a body line carrying two full commit
    # hashes, which no length rule survives, and its messages are not a
    # person's to fix.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # committed reads a range, so it needs both ends
      - name: The range this event added
        id: range
        # A branch's first push reports an all-zero "before", and there is
        # nothing to compare against, so fall back to the one commit.
        run: |
          before='${{ github.event.before }}'
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "range=$before..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "${{ github.sha }}^" >/dev/null; then
            # A branch's first push reports an all-zero predecessor, and a force
            # push reports one that no longer exists. Either way there is
            # nothing to compare against, so check the one commit.
            echo "range=${{ github.sha }}~1..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            # The very first commit in a repository has no parent, so no
            # range can name it. Both the linter and the imperative check
            # take a single commit, and that commit is the one most likely
            # to have been written without care.
            echo "range=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: crate-ci/committed@02af07ed1d11ad69a96ab75f08c9831a4e2c00da # v1.1.12
        with:
          args: --no-merge-commit
          commits: ${{ steps.range.outputs.range }}
      # committed's own imperative rule flags nothing, so this is what does.
      - name: Subjects in the imperative
        run: python scripts/imperative.py ${{ steps.range.outputs.range }}
      # A Claude-Session line points into one person's account: a dead link to everyone else.
      - name: No links to a Claude session
        run: python scripts/no_session_links.py ${{ steps.range.outputs.range }}

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # the default is 360; this job takes under a minute
    strategy:
      fail-fast: false           # one version failing should not hide another
      matrix:                    # every version pyproject.toml claims to support
        python: ["3.12", "3.13", "3.14"]
    steps:
      # Actions are pinned to a commit, not a tag, as GitHub's own hardening guide asks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0         # the last-checked rule reads each page's commit date
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true     # setup-python's own cache covers pip, not uv
          version: "0.12.13"     # pin uv itself
          python-version: ${{ matrix.python }}
      # From the lock file, so a new release of a tool cannot turn CI red on its
      # own; Dependabot moves the lock deliberately instead.
      - run: uv sync --locked --all-extras
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy src
      - name: The rules that guard the rules
        # Coverage is measured and printed, with no threshold yet: a number
        # picked before there is data is a guess with a gate on it.
        run: uv run pytest -q -p no:cacheprovider --strict-markers --cov
      # - name: The project's own check
      #   run: uv run <command>

  # Each rule the Python scripts enforce, switched off in turn; red if one is not caught
  # by the test named after it. A job of its own with no time limit: the owner's rule is
  # that a mutation run is never capped. The report is measured, so it is kept as an
  # artifact, never committed.
  rule-mutations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.12.13"
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - name: Every rule switched off in turn
        run: uv run python scripts/mutate.py --write "${{ runner.temp }}/rule-mutations.md"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rule-mutations
          path: ${{ runner.temp }}/rule-mutations.md
          if-no-files-found: ignore   # a run that failed before writing has nothing to keep

  # The app: its layer rules, the rules' own tests, and every module's tests and lint.
  # The runner image already holds the Android SDK and points ANDROID_HOME at it.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # a cold Gradle cache takes about five minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"     # the version agreed for the app; Gradle runs on it too
      # Caches Gradle's downloads, and refuses a wrapper jar Gradle did not publish.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: The app's gate
        run: ./gradlew check --console=plain
      # ADR-CVM-007: the same gate with every plugin folder built in, so each plugin's tests run
      # and its manifest entries are checked even when the default list leaves it out.
      - name: The app's gate, with every plugin
        run: ./gradlew -PcvPlugins=all check --console=plain

  # The app's code health, for the bridge's code-health page. scripts/ratchet.py measures it
  # with scripts/levels.py and fails when a measure got worse than the base, unless the
  # pull request names it on a Ratchet-Exception line. Main keeps its levels with its own
  # run as the artifact quality-levels. Nothing measured is committed; quality.json holds
  # only the test-time budget.
  quality:
    runs-on: ubuntu-latest
    # No time limit, on purpose, as in claude-voice: this job holds the mutation run, and a
    # run cut short proves nothing.
    permissions:
      contents: read
      actions: read              # to fetch the levels main kept with its own run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0         # the base is read, or measured in a copy, by the ratchet
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Missing levels, from a run cancelled or expired, leave no file, and the ratchet then
      # measures the base itself.
      - name: The levels main kept for the base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow checks.yml --commit "$BASE" \
                         --event push --json databaseId -q '.[].databaseId'); do
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name quality-levels --dir "$RUNNER_TEMP/base" \
              && break
          done
          ls "$RUNNER_TEMP/base" 2>/dev/null || echo "Main kept no levels for $BASE; the ratchet will measure it."
      - name: The quality ratchet
        if: github.event_name == 'pull_request'
        env:                     # the pull request's text, for its Ratchet-Exception lines
          RATCHET_EXCEPTIONS: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ratchet.py check --base "$BASE" --levels "$RUNNER_TEMP/base/levels.json" --out "$RUNNER_TEMP/levels.json"
      # On main only measure: the pull request that landed was already compared, and its
      # exception lines are not there to read, so comparing again would turn main red.
      - name: Measure main
        if: github.event_name == 'push'
        run: python3 scripts/levels.py --out "$RUNNER_TEMP/levels.json"
      - name: Keep Pitest's reports with this run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pitest-reports
          path: |
            core/build/reports/pitest
            plugin-api/build/reports/pitest
            plugins/*/rules/build/reports/pitest
          if-no-files-found: ignore   # plugin-api may have no mutants at all
      - name: Keep main's levels with this run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-levels
          path: ${{ runner.temp }}/levels.json
          if-no-files-found: error   # a failed measure on main shows at once
