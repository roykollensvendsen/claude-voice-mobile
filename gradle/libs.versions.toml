# The versions agreed with the Android developer, the combination their prototype builds with.
[versions]
agp = "8.7.3"
kotlin = "2.1.0"
junit = "5.11.3"
junit4 = "4.13.2"
# Runs the app's Android code in its unit tests, off the phone (#151).
robolectric = "4.14.1"
serialization = "1.7.3"
# Measuring only, for the code-health page; none of them is part of the gate.
kover = "0.9.1"
detekt = "1.23.7"
pitest-plugin = "1.15.0"
pitest-engine = "1.17.4"
pitest-junit5 = "1.2.1"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
# The Android images Robolectric runs the app's tests on, one per version a test names with
# @Config; Robolectric runs offline from these, so Gradle fetches and checks them (#170).
robolectric-sdk32 = { module = "org.robolectric:android-all-instrumented", version = "12.1-robolectric-8229987-i7" }
robolectric-sdk33 = { module = "org.robolectric:android-all-instrumented", version = "13-robolectric-9030017-i7" }
robolectric-sdk35 = { module = "org.robolectric:android-all-instrumented", version = "15-robolectric-12650502-i7" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-plugin" }
